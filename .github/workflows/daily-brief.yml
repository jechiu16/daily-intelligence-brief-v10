name: Daily Intelligence Brief

on:
  schedule:
    # 07:00 Asia/Taipei = 23:00 UTC on the previous day.
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-intelligence-brief
  cancel-in-progress: false

jobs:
  run-daily-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TZ: Asia/Taipei
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: "deepseek-v4-pro"
      DEEPSEEK_FAST_MODEL: "deepseek-v4-flash"
      DEEPSEEK_THINKING: "enabled"
      DEEPSEEK_REASONING_EFFORT: "max"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_NARRATOR_MODEL: "gemini-3.5-flash"
      GEMINI_SEARCH_MODEL: "gemini-3.1-flash-lite"
      GEMINI_ENABLE_DAILY_SEARCH: "true"
      GEMINI_ENABLE_PERIPHERY_SEARCH: "true"
      GEMINI_THESIS_REVIEW_LIMIT: "1"
      GEMINI_ACTIVE_THESIS_UPDATE_LIMIT: "1"
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run daily pipeline
        run: timeout 55m python -m src.orchestrator --force

      - name: Commit generated memory updates
        run: |
          git add memory/
          if git diff --cached --quiet; then
            echo "No memory changes to commit."
          else
            git commit -m "DIB daily snapshot $(date +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
